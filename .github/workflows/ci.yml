name: ci
on:
  # Pull requests only (action minutes ran out when every push ran); a tag builds the ISO release.
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Syntax of every script
        run: for f in scripts/*.sh scripts/lib/*.sh scripts/recipes/*.sh packages/*/run.sh packages/*/status.sh vps/*.sh tests/*.sh; do bash -n "$f" || exit 1; done
      - name: shellcheck (errors only)
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error -x scripts/*.sh scripts/lib/*.sh scripts/recipes/*.sh packages/*/run.sh packages/*/status.sh vps/*.sh tests/*.sh
      - name: shellcheck warnings in the pool scripts (informational, counts only)
        continue-on-error: true
        run: |
          shellcheck -x -S warning -f gcc scripts/manage-pool.sh tests/pool-*.sh > /tmp/pool-shellcheck.txt || true
          echo "shellcheck warnings in manage-pool.sh and tests/pool-*.sh: $(wc -l < /tmp/pool-shellcheck.txt)"
          cut -d: -f4- /tmp/pool-shellcheck.txt | sort | uniq -c | sort -rn | head -10
      - name: Tests that need no root (every tests/*.sh; tests/run-all.sh lists them, root tests are skipped here)
        run: |
          sudo apt-get install -y -qq jq python3-pil
          HS_TEST_CI=1 bash tests/run-all.sh

  nixos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Evaluate the system configuration
        run: |
          cp machine.toml.example machine.toml
          sed -i 's/CHANGEME/deadbeef/' machine.toml
          cat > hardware-configuration.nix <<'HW'
          { ... }: {
            fileSystems."/" = { device = "/dev/vda1"; fsType = "ext4"; };
            boot.loader.grub.enable = false;
          }
          HW
          nix-instantiate '<nixpkgs/nixos>' -A system -I nixos-config=./configuration.nix --show-trace >/dev/null
      - name: Capability matrix (each capability alone, all of them, none; docs/PLAN-modular-core.md)
        run: |
          rm -f machine.toml hardware-configuration.nix
          bash scripts/dev/nix-matrix.sh
      - name: Installer ISO evaluates (installer/iso.nix; the image itself is built on a release tag)
        run: bash scripts/dev/build-iso.sh --eval

  # The installer ISO (installer/iso.nix, docs/PLAN-modular-core.md step 10): built when a version tag is pushed and attached to the release.
  iso:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build the ISO
        run: bash scripts/dev/build-iso.sh
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          iso=$(ls result-iso/iso/*.iso | head -n1)
          sha256sum "$iso" | tee "$iso.sha256"
          gh release create "$GITHUB_REF_NAME" "$iso" "$iso.sha256" --title "$GITHUB_REF_NAME" --notes "Installer ISO: boot it in UEFI mode and run hs-install. Guide: docs/install.md." || gh release upload "$GITHUB_REF_NAME" "$iso" "$iso.sha256" --clobber

  # The storage scripts on loop devices with the real tools: xfs, btrfs, ext4, LUKS (dm-crypt),
  # restic, mergerfs. REQUIRE_ALL makes a test that cannot run a failure instead of a skip.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq restic xfsprogs btrfs-progs cryptsetup mergerfs snapraid jq attr psmisc python3-pil
      - name: Tests
        run: sudo env HS_TEST_CI=1 HS_TEST_ROOT=1 bash tests/run-all.sh --root-only
