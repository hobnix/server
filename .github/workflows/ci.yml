name: ci
on:
  # Pull requests, the merge queue, and `develop` after each merge (two pull requests that pass alone can fail together); a tag builds
  # the ISO release. A push to a feature branch runs nothing: its pull request does.
  push:
    tags: ['v*']
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The nixpkgs revision the servers run (nixos-version --revision): the cache only helps when CI builds the same store paths. Used by the
  # jobs `nixos` and `iso`, so the ISO that ships is built from the revision CI evaluated. Move it when the servers' channel moves.
  NIXPKGS_REV: 774debe7a0d1b496e35677ad955a1011c6ff74f3

jobs:
  # What did the change touch? Draft pull requests run nothing (mark one ready for review to start CI); the slow jobs run only when they can
  # be affected. A tag, a push to develop or a manual run always runs everything.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      nix: ${{ steps.f.outputs.nix }}
      root: ${{ steps.f.outputs.root }}
      rust: ${{ steps.f.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          nix=true root=true rust=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
            # nix: the system configuration and the web build (web/ is built by pkgs/hs-web.nix); root: scripts and root tests (loop devices, packages against this core)
            echo "$files" | grep -qvE '^(docs/|tests/|\.claude/|\.github/ISSUE_TEMPLATE/)|\.md$' || nix=false
            echo "$files" | grep -qvE '^(web/|docs/|\.claude/|\.github/ISSUE_TEMPLATE/)|\.md$' || root=false
            # rust: the Cargo workspace, the scripts it stands in for, or this workflow
            echo "$files" | grep -qE '^rust/|^\.github/workflows/ci\.yml$|^scripts/vault-change\.sh$|^tests/vault-change(-rust)?\.sh$|^tests/lib\.sh$|^scripts/lib/job\.sh$|^scripts/job-record\.py$|^scripts/jobs-change\.sh$|^scripts/job-reconcile\.sh$|^tests/job-(record|reconcile)(-rust)?\.sh$|^tests/jobs-change\.sh$' || rust=false
          fi
          echo "nix=$nix" >> "$GITHUB_OUTPUT"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "evaluate the system: $nix; root tests and packages: $root; rust: $rust"

  # The Rust workspace (docs/adr/0001-rust-strangler.md): format, clippy without warnings, tests; the lock file must be up to date.
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: tests/vault-change.sh against the binary, and shell and Rust side by side (tests/vault-change-rust.sh)
        run: |
          cargo build --locked
          HOBNIX_BIN=$PWD/target/debug/hobnix bash ../tests/vault-change-rust.sh
      - name: tests/job-record.sh, job-reconcile.sh and jobs-change.sh against the binary, and python and Rust side by side (tests/job-record-rust.sh)
        run: HOBNIX_BIN=$PWD/target/debug/hobnix bash ../tests/job-record-rust.sh

  scripts:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Syntax of every script
        run: for f in scripts/*.sh scripts/lib/*.sh scripts/recipes/*.sh vps/*.sh tests/*.sh; do bash -n "$f" || exit 1; done
      - name: Changelog entry for a user-visible change (warning only)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          bash scripts/dev/changelog-check.sh "$BASE" || echo "::warning::No docs/changelog entry: add one if users see this change (CONTRIBUTING.md)."
      - name: shellcheck (errors only)
        run: |
          # every file, four processes at a time (one process for all of them took about 90 s)
          echo scripts/*.sh scripts/lib/*.sh scripts/recipes/*.sh vps/*.sh tests/*.sh | xargs -n 25 -P 4 shellcheck -S error -x
      - name: shellcheck warnings in the pool scripts (informational, counts only)
        continue-on-error: true
        run: |
          shellcheck -x -S warning -f gcc scripts/manage-pool.sh tests/pool-*.sh > /tmp/pool-shellcheck.txt || true
          echo "shellcheck warnings in manage-pool.sh and tests/pool-*.sh: $(wc -l < /tmp/pool-shellcheck.txt)"
          cut -d: -f4- /tmp/pool-shellcheck.txt | sort | uniq -c | sort -rn | head -10

  # The tests that need no root (every tests/*.sh; tests/run-all.sh lists them, root tests are skipped here), split over four runners:
  # one runner took about 9 minutes. A new test needs no entry here, --shard takes every fourth one.
  tests:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tests, part ${{ matrix.shard }} of 4
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq python3-pil
          HS_TEST_CI=1 bash tests/run-all.sh --jobs 2 --shard ${{ matrix.shard }}/4

  # The default package repositories at their latest main, checked against this core: manifests, indexes and their own tests. A core change
  # that breaks a package is seen here, before a release (docs/PLAN-packages.md, "Compatibility and CI across repositories").
  packages:
    needs: changes
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: hobnix/recipes
          path: pkgs/recipes
      - uses: actions/checkout@v5
        with:
          repository: hobnix/extensions
          path: pkgs/extensions
      - name: Manifests and indexes
        run: |
          mkdir -p pkgs/tree
          ln -s "$PWD/pkgs/recipes/recipes" pkgs/tree/packages
          ln -s "$PWD/pkgs/extensions/extensions" pkgs/tree/capabilities
          HS_PACKAGES_ROOT="$PWD/pkgs/tree" python3 -I scripts/pkg.py validate
          python3 -I scripts/pkg.py repo-check pkgs/recipes
          python3 -I scripts/pkg.py repo-check pkgs/extensions
      - name: The tests of both repositories against this core
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq python3-pil
          for r in recipes extensions; do HS_CORE="$PWD" HS_TEST_CI=1 bash pkgs/$r/tests/run-all.sh || exit 1; done

  nixos:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The pinned nixpkgs comes from the cache, not from a download per run (GitHub answered 429 once and the job failed). The `iso` job
      # still downloads it: it runs on a tag only.
      - uses: actions/cache@v4
        with:
          path: ~/nixpkgs.tar.gz
          key: nixpkgs-${{ env.NIXPKGS_REV }}
      - name: Unpack the pinned nixpkgs
        run: |
          [ -s ~/nixpkgs.tar.gz ] || curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o ~/nixpkgs.tar.gz "https://github.com/NixOS/nixpkgs/archive/$NIXPKGS_REV.tar.gz"
          mkdir -p "$RUNNER_TEMP/nixpkgs"
          tar -xzf ~/nixpkgs.tar.gz -C "$RUNNER_TEMP/nixpkgs" --strip-components=1
          echo "NIXPKGS_DIR=$RUNNER_TEMP/nixpkgs" >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=${{ env.NIXPKGS_DIR }}
      - name: Evaluate the system configuration
        run: |
          cp machine.toml.example machine.toml
          sed -i 's/CHANGEME/deadbeef/' machine.toml
          cat > hardware-configuration.nix <<'HW'
          { ... }: {
            fileSystems."/" = { device = "/dev/vda1"; fsType = "ext4"; };
            boot.loader.grub.enable = false;
          }
          HW
          nix-instantiate '<nixpkgs/nixos>' -A system -I nixos-config=./configuration.nix --show-trace >/dev/null
      # Fills the binary cache (config/binary-cache.nix). Runs only when the repository variable CACHIX_CACHE is set; the push needs the secret
      # CACHIX_AUTH_TOKEN, which pull requests from forks and Dependabot do not get, so they only read from the cache.
      - uses: cachix/cachix-action@v15
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the Rust program (pkgs/hobnix.nix, with its tests)
        run: nix-build -E 'with import <nixpkgs> {}; callPackage ./pkgs/hobnix.nix {}' --no-out-link
      # The web frontend (npm ci + Vite build): pushed to the cache like the Rust program, and a stale npmDepsHash fails here instead of on a server.
      - name: Build the web frontend (pkgs/hs-web.nix)
        run: nix-build -E 'with import <nixpkgs> {}; callPackage ./pkgs/hs-web.nix {}' --no-out-link
      # 20 minutes: only for a release (a pull request into main), a tag or a manual run; the plain evaluation above runs on every pull request.
      - name: Capability matrix (each capability alone, all of them, none; docs/PLAN-modular-core.md)
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        run: |
          rm -f machine.toml hardware-configuration.nix
          bash scripts/dev/nix-matrix.sh
      - name: Installer ISO evaluates (installer/iso.nix; the image itself is built on a release tag)
        run: bash scripts/dev/build-iso.sh --eval

  # The installer ISO (installer/iso.nix, docs/PLAN-modular-core.md step 10): built when a version tag is pushed and attached to the release.
  # It waits for every test job. `!cancelled()` replaces the implicit success() so that a skipped `rust` job does not skip this one; the
  # other jobs must have succeeded (a failed or skipped one stops the release). On a tag `changes` turns every job on, so `rust` is only
  # skipped if that ever changes.
  iso:
    needs: [changes, rust, scripts, tests, packages, nixos, integration]
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && needs.changes.result == 'success'
      && (needs.rust.result == 'success' || needs.rust.result == 'skipped')
      && needs.scripts.result == 'success'
      && needs.tests.result == 'success'
      && needs.packages.result == 'success'
      && needs.nixos.result == 'success'
      && needs.integration.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v27
        with:
          # The same revision the `nixos` job evaluates (env.NIXPKGS_REV above).
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ env.NIXPKGS_REV }}.tar.gz
      - name: Build the ISO
        run: bash scripts/dev/build-iso.sh
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          iso=$(ls result-iso/iso/*.iso | head -n1)
          # The checksum names the bare file, so `sha256sum -c` works in the folder a downloader saved both files to.
          # Copy the files out of the read-only store path; the checksum is computed in the folder of the copies.
          mkdir -p release-assets
          cp "$iso" release-assets/
          cd release-assets
          iso=$(basename "$iso")
          sha256sum "$iso" | tee "$iso.sha256"
          sha256sum -c "$iso.sha256"
          # Release notes from docs/RELEASE-NOTES-<major>.<minor>.md (v0.1.0 and v0.1.1 use RELEASE-NOTES-0.1.md); without such a file the
          # release gets GitHub's generated notes and a warning.
          mm=$(echo "${GITHUB_REF_NAME#v}" | cut -d. -f1,2)
          notes="$GITHUB_WORKSPACE/docs/RELEASE-NOTES-$mm.md"
          if [ -f "$notes" ]; then
            notes_args=(--notes-file "$notes")
          else
            echo "::warning::$notes not found: the release gets generated notes."
            notes_args=(--generate-notes)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$iso" "$iso.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$iso" "$iso.sha256" --title "$GITHUB_REF_NAME" "${notes_args[@]}"
          fi

  # The storage scripts on loop devices with the real tools: xfs, btrfs, ext4, LUKS (dm-crypt),
  # restic, mergerfs. REQUIRE_ALL makes a test that cannot run a failure instead of a skip.
  integration:
    needs: changes
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq restic xfsprogs btrfs-progs cryptsetup mergerfs snapraid jq attr psmisc python3-pil
      - name: Tests
        run: sudo env HS_TEST_CI=1 HS_TEST_ROOT=1 bash tests/run-all.sh --root-only

  # The one check a branch rule asks for: green when no job failed or was cancelled (a job that did not have to run counts as fine).
  # Jobs come and go and the test parts have their own names; the rule only knows `ci-ok`.
  ci-ok:
    if: always()
    needs: [changes, rust, scripts, tests, packages, nixos, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
