name: ci
on:
  # Pull requests (into any branch: develop, 0.2, main), the merge queue, and `develop` and `0.2` after each merge (two pull requests that
  # pass alone can fail together); a tag builds the ISO release; every night the full set runs on `develop` (a schedule runs on the default
  # branch only; the release branch `0.2` gets its full run from the merge queue and from a manual run of this workflow on it).
  # A push to a feature branch runs nothing: its pull request does.
  push:
    tags: ['v*']
    branches: [develop, '0.2', '0.[3-9]', '0.[1-9][0-9]', '[1-9].[0-9]*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What did the change touch? Draft pull requests run nothing (mark one ready for review to start CI); the slow jobs run only when they can
  # be affected. A pull request runs the tests that mention its files (scripts/dev/tests-for.sh); a push to develop or 0.2, the merge
  # queue, a tag, the nightly run and a manual run always run everything.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      nix: ${{ steps.f.outputs.nix }}
      capmx: ${{ steps.f.outputs.capmx }}
      root: ${{ steps.f.outputs.root }}
      rust: ${{ steps.f.outputs.rust }}
      ext: ${{ steps.f.outputs.ext }}
      pkg: ${{ steps.f.outputs.pkg }}
      shellcheck_files: ${{ steps.f.outputs.shellcheck_files }}
      test_names: ${{ steps.f.outputs.test_names }}
      test_matrix: ${{ steps.f.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          nix=true root=true rust=true ext=true pkg=true capmx=true
          # only a pull request is narrowed; everything else gets the full set (the merge queue, `develop`, the nightly run)
          [ "${{ github.event_name }}" = pull_request ] || BASE=""
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
            # nix: the system configuration and the web build (web/ is built by pkgs/hs-web.nix); root: scripts and root tests (loop devices, packages against this core)
            echo "$files" | grep -qvE '^(docs/|tests/|\.claude/|\.github/ISSUE_TEMPLATE/)|\.md$' || nix=false
            echo "$files" | grep -qvE '^(web/|docs/|\.claude/|\.github/ISSUE_TEMPLATE/)|\.md$' || root=false
            # rust: the Cargo workspace, the scripts it stands in for, the nixpkgs pin (its rustc is the toolchain), the file size check, or this workflow
            # pkg: what the package repositories are checked against (the core's helpers and libraries, the package folders and their tests)
            # capmx: the Nix interface capability packages build against (decision O9 of docs/PLAN-capabilities-repo.md); the matrix runs with --vendor then
            echo "$files" | grep -qE '^(capabilities/(default\.nix|options\.nix|nix-api-level)|configuration\.nix|scripts/pkg[^/]*\.py|scripts/lib/pkg_vendor\.py|scripts/dev/(nix-matrix|official-ref)\.sh)$' || capmx=false
            echo "$files" | grep -qE '^(scripts/pkg|scripts/lib/|scripts/recipes/|packages/|capabilities/|config/package-repos\.toml|scripts/dev/(official-ref|core-names-check)|tests/(core-names|official-ref|profile-core-only|fixtures/official)|tests/lib|tests/pkg|\.github/workflows/ci\.yml)' || pkg=false
            echo "$files" | grep -qE '^rust/|^\.github/workflows/ci\.yml$|^config/nixpkgs-pin\.toml$|^scripts/dev/rust-file-size\.sh$|^tests/rust-file-size\.sh$|^scripts/vault-change\.sh$|^tests/vault-change(-rust)?\.sh$|^tests/lib\.sh$|^scripts/lib/job\.sh$|^scripts/job-record\.py$|^scripts/jobs-change\.sh$|^scripts/job-reconcile\.sh$|^tests/job-(record|reconcile)(-rust)?\.sh$|^tests/jobs-change\.sh$|^scripts/dev/rust-shell\.nix$|^scripts/state-db\.py$|^scripts/lib/(event-kinds\.tsv|pkg_events\.py|pkg-events/)|^tests/event-writer-(rust|concurrent)\.sh$|^tests/event-writer-sides\.py$' || rust=false
            # ext: the extension crates of hobnix/official are built against the SDK (job ext-crates): only its folder, the workspace files, this workflow
            echo "$files" | grep -qE '^rust/(hobnix-ext-sdk/|hobnix-pkg(-[a-z]+)?/|Cargo\.(toml|lock)$)|^\.github/workflows/ci\.yml$' || ext=false
          fi
          # shellcheck: a pull request checks the shell files it changed (the empty list: nothing to check); everything else checks every file
          sc=all
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            sc=$(git diff --name-only --diff-filter=d "$BASE" HEAD | grep -E '^(scripts/(lib/|recipes/)?[^/]+|vps/[^/]+|tests/[^/]+)\.sh$' | tr '\n' ' ' || true)
            sc=${sc:-none}
          fi
          # tests: the names a pull request needs, or all; the shards are as many as the work needs (6 tests or so per runner, 4 at most)
          names=$(bash scripts/dev/tests-for.sh "$BASE")
          if [ "$names" = all ]; then matrix='[1,2,3,4]'
          else
            n=$(wc -w <<<"$names")
            if [ "$n" -eq 0 ]; then matrix='[]'
            elif [ "$n" -le 6 ]; then matrix='[1]'
            elif [ "$n" -le 12 ]; then matrix='[1,2]'
            else matrix='[1,2,3,4]'; fi
          fi
          echo "nix=$nix" >> "$GITHUB_OUTPUT"
          echo "capmx=$capmx" >> "$GITHUB_OUTPUT"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "ext=$ext" >> "$GITHUB_OUTPUT"
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          echo "shellcheck_files=$sc" >> "$GITHUB_OUTPUT"
          echo "test_names=$names" >> "$GITHUB_OUTPUT"
          echo "test_matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "evaluate the system: $nix; root tests: $root; packages: $pkg; rust: $rust"
          echo "shellcheck: $sc"
          echo "tests: $names (shards $matrix)"

  # The Rust workspace (docs/adr/0001-rust-strangler.md): format, clippy without warnings, tests; the lock file must be up to date.
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      # rust/rust-toolchain.toml names the rustc of the nixpkgs pin (job nixos checks that); rustup >= 1.28 does not install it by itself
      - name: The pinned toolchain
        id: toolchain
        run: |
          ch=$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$ch" --profile minimal --component clippy,rustfmt
          rustc --version
          echo "channel=$ch" >> "$GITHUB_OUTPUT"
      # hobnix-core links the system SQLite and refuses one with the WAL-reset bug, which the one of ubuntu-latest may have: what compiles
      # or tests it runs in scripts/dev/rust-shell.nix, the rustc and the SQLite of the nixpkgs pin
      - name: Read the nixpkgs pin
        run: bash ../scripts/dev/nixpkgs-pin.sh github-env >> "$GITHUB_ENV"
      # The same revision and the same cache entry as the `nixos` job: no download per run. scripts/dev/rust-shell.nix takes the unpacked
      # folder from HOBNIX_NIXPKGS_DIR.
      - uses: actions/cache@v4
        with:
          path: ~/nixpkgs.tar.gz
          key: nixpkgs-${{ env.NIXPKGS_REV }}
      - name: Unpack the pinned nixpkgs
        run: |
          [ -s ~/nixpkgs.tar.gz ] || curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o ~/nixpkgs.tar.gz "https://github.com/NixOS/nixpkgs/archive/$NIXPKGS_REV.tar.gz"
          mkdir -p "$RUNNER_TEMP/nixpkgs"
          tar -xzf ~/nixpkgs.tar.gz -C "$RUNNER_TEMP/nixpkgs" --strip-components=1
          echo "HOBNIX_NIXPKGS_DIR=$RUNNER_TEMP/nixpkgs" >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@v27
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        shell: nix-shell ../scripts/dev/rust-shell.nix --run "bash -eo pipefail {0}"
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        shell: nix-shell ../scripts/dev/rust-shell.nix --run "bash -eo pipefail {0}"
        run: cargo test --locked --all-features
      - name: Docs (every rustdoc warning fails)
        env:
          RUSTDOCFLAGS: -D warnings
        shell: nix-shell ../scripts/dev/rust-shell.nix --run "bash -eo pipefail {0}"
        run: cargo doc --locked --no-deps --all-features
      - name: File sizes (scripts/dev/rust-file-size.sh)
        run: bash ../scripts/dev/rust-file-size.sh check
      # The release binary, checked against the sha256: the repository allows no third-party action here (an action that is not allowed
      # stops the whole workflow before any job, "startup_failure"). To update: change both values, the sha256 is on the release page.
      - name: Get cargo-deny
        env:
          VERSION: 0.22.1
          SHA256: 13f7e825e9cb811c2f8de63f29b0f45851dfb53004029f0f2501af524728364d
        run: |
          name="cargo-deny-$VERSION-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$VERSION/$name.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      # rust/deny.toml: licences, bans and sources always fail; a new advisory only reports on a pull request (it is not the pull
      # request's fault) and fails on push and on the nightly run
      - name: cargo deny (licences, bans, sources)
        run: cargo deny check bans licenses sources
      - name: cargo deny (advisories)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: cargo deny check advisories
      # an extension builds the SDK alone: serde_json without hobnix-core's preserve_order (hobnix-pkg/src/wire pins the wire lines either way)
      - name: Tests of the SDK built alone
        run: cargo test --locked -p hobnix-pkg -p hobnix-pkg-command -p hobnix-pkg-service -p hobnix-ext-sdk
      - name: Build the program
        shell: nix-shell ../scripts/dev/rust-shell.nix --run "bash -eo pipefail {0}"
        run: cargo build --locked
      - name: tests/vault-change.sh against the binary, and shell and Rust side by side (tests/vault-change-rust.sh)
        run: HOBNIX_BIN=$PWD/target/debug/hobnix bash ../tests/vault-change-rust.sh
      - name: tests/job-record.sh, job-reconcile.sh and jobs-change.sh against the binary, and python and Rust side by side (tests/job-record-rust.sh)
        run: HOBNIX_BIN=$PWD/target/debug/hobnix bash ../tests/job-record-rust.sh
      # in the nix shell so that the python writer beside the Rust one links the same SQLite, as on a server
      - name: The event log written by python and Rust, side by side and at the same time
        shell: nix-shell ../scripts/dev/rust-shell.nix --run "bash -eo pipefail {0}"
        run: |
          HOBNIX_BIN=$PWD/target/debug/hobnix bash ../tests/event-writer-rust.sh
          HOBNIX_BIN=$PWD/target/debug/hobnix bash ../tests/event-writer-concurrent.sh
      - name: SDK examples, also built statically for musl (tests/ext-sdk-rust.sh runs its musl block when the target is installed)
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y --no-install-recommends musl-tools
          bash ../tests/ext-sdk-rust.sh

  scripts:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The nixpkgs pin is well formed and written in one place only
        run: bash scripts/dev/nixpkgs-pin.sh check
      - name: Syntax of every script
        run: for f in scripts/*.sh scripts/lib/*.sh scripts/recipes/*.sh vps/*.sh tests/*.sh; do bash -n "$f" || exit 1; done
      - name: Changelog entry for a user-visible change (warning only)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          bash scripts/dev/changelog-check.sh "$BASE" || echo "::warning::No docs/changelog entry: add one if users see this change (CONTRIBUTING.md)."
      - name: shellcheck (errors only)
        env:
          FILES: ${{ needs.changes.outputs.shellcheck_files }}
        run: |
          # a pull request: the changed files only (`none`: no shell file changed). Anything else: every file, four processes at a time
          # (one process for all of them took about 90 s)
          case "$FILES" in
            none) echo "no shell file changed" ;;
            all|"") echo scripts/*.sh scripts/lib/*.sh scripts/recipes/*.sh vps/*.sh tests/*.sh | xargs -n 25 -P 4 shellcheck -S error -x ;;
            *) echo $FILES | xargs -n 25 -P 4 shellcheck -S error -x ;;
          esac
      - name: shellcheck at warning level on the changed files (ratchet, baseline tests/shellcheck-ratchet.tsv)
        if: github.event_name == 'pull_request' && needs.changes.outputs.shellcheck_files != 'none' && needs.changes.outputs.shellcheck_files != 'all'
        env:
          FILES: ${{ needs.changes.outputs.shellcheck_files }}
        # a changed file may not have more findings than the baseline lists (a new file: none); fewer: lower the number (--update)
        run: bash scripts/dev/shellcheck-ratchet.sh $FILES
      - name: shfmt layout of the changed files (-i 2 -ci; reports only until the flags are checked on a runner)
        if: github.event_name == 'pull_request' && needs.changes.outputs.shellcheck_files != 'none' && needs.changes.outputs.shellcheck_files != 'all'
        continue-on-error: true
        env:
          FILES: ${{ needs.changes.outputs.shellcheck_files }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shfmt
          shfmt --version
          # shellcheck disable=SC2086
          shfmt -d -i 2 -ci $FILES
      - name: shellcheck warnings in the pool scripts (informational, counts only)
        if: needs.changes.outputs.shellcheck_files == 'all'
        continue-on-error: true
        run: |
          shellcheck -x -S warning -f gcc scripts/manage-pool.sh tests/pool-*.sh > /tmp/pool-shellcheck.txt || true
          echo "shellcheck warnings in manage-pool.sh and tests/pool-*.sh: $(wc -l < /tmp/pool-shellcheck.txt)"
          cut -d: -f4- /tmp/pool-shellcheck.txt | sort | uniq -c | sort -rn | head -10

  # The tests that need no root (tests/run-all.sh lists them, root tests are skipped here), split over up to four runners: one runner took
  # about 9 minutes. A pull request runs the tests that mention its files (job `changes`), everything else all of them. A new test needs
  # no entry here, --shard takes every Nth one. `shards` is [] when no test matches: the job is skipped and counts as fine.
  tests:
    needs: changes
    if: needs.changes.outputs.test_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tests, part ${{ matrix.shard }} of ${{ strategy.job-total }}
        env:
          NAMES: ${{ needs.changes.outputs.test_names }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq python3-pil
          only=()
          if [ "$NAMES" != all ]; then for n in $NAMES; do only+=(--only "$n"); done; fi
          HS_TEST_CI=1 bash tests/run-all.sh --jobs 2 --shard ${{ matrix.shard }}/${{ strategy.job-total }} "${only[@]}"

  # hobnix/official checked against this core (hobnix/core#1074, docs/PLAN-packages.md): manifests, index and its own tests, one checkout. A core change
  # that breaks a package is seen here, before a release. Ref: the branch of the same name if it exists there (a core change that needs a package
  # change ships both), else `main` (what servers get; never develop); a release pull request (into main) and a v* tag use `main`
  # (scripts/dev/official-ref.sh). The job logs the commit it used. The old recipes/extensions/capabilities repositories are not checked any more:
  # they are frozen (D5); the packages the core refers to by name must be in official (scripts/dev/core-names-check.py, D4).
  packages:
    needs: changes
    if: needs.changes.outputs.pkg == 'true' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Choose the ref of hobnix/official
        id: offref
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          RELEASE: ${{ github.base_ref == 'main' || startsWith(github.ref, 'refs/tags/') }}
        run: echo "ref=$(bash scripts/dev/official-ref.sh "$HEAD_REF" "$RELEASE")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: hobnix/official
          ref: ${{ steps.offref.outputs.ref }}
          path: pkgs/official
      - name: Manifests and index
        run: |
          echo "hobnix/official: ${{ steps.offref.outputs.ref }} at $(git -C pkgs/official rev-parse HEAD)"
          mkdir -p pkgs/tree
          ln -s "$PWD/pkgs/official/recipes" pkgs/tree/packages
          ln -s "$PWD/pkgs/official/extensions" pkgs/tree/capabilities
          HS_PACKAGES_ROOT="$PWD/pkgs/tree" python3 -I scripts/pkg.py validate
          python3 -I scripts/pkg.py repo-check pkgs/official
      - name: The names the core refers to are in official
        run: python3 -I scripts/dev/core-names-check.py pkgs/official
      - name: The tests of hobnix/official against this core
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq python3-pil
          HS_CORE="$PWD" HS_TEST_CI=1 bash pkgs/official/tests/run-all.sh

  # The Rust crates of hobnix/official built and tested against the SDK of this core (ADR 0031): official's crates pin the SDK by git rev;
  # `--config patch` replaces each SDK crate (hobnix-pkg, hobnix-pkg-command, hobnix-pkg-service and the deprecated hobnix-ext-sdk) with
  # the one of this checkout, nothing is edited; cargo warns about a patch the crate does not use. No --locked: the patch changes the SDK
  # source in the crate's Cargo.lock. Ref of official: the branch of the same name, else develop (main for a release). Reads only; no secrets.
  ext-crates:
    needs: changes
    if: needs.changes.outputs.ext == 'true' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Choose the ref of hobnix/official
        id: offref
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          RELEASE: ${{ github.base_ref == 'main' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          # unlike official-ref.sh (packages job: main): a core pull request targets develop, so official's develop is the fallback;
          # a release pull request or a tag uses main
          url=https://github.com/hobnix/official.git
          if [ "$RELEASE" = true ]; then ref=main
          elif git ls-remote --exit-code --heads "$url" "$HEAD_REF" >/dev/null 2>&1; then ref=$HEAD_REF
          else ref=develop; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: hobnix/official
          ref: ${{ steps.offref.outputs.ref }}
          path: pkgs/official
      - name: Crates of official against this SDK
        run: |
          echo "hobnix/official: ${{ steps.offref.outputs.ref }} at $(git -C pkgs/official rev-parse HEAD)"
          # the toolchain official pins (rustup does not install it by itself any more); it builds the SDK too, so it must not be older than
          # `rust-version` in rust/Cargo.toml (cargo refuses the SDK then)
          ch=$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' pkgs/official/rust-toolchain.toml)
          rustup toolchain install "$ch" --profile minimal
          patch=()
          for k in hobnix-pkg hobnix-pkg-command hobnix-pkg-service hobnix-ext-sdk; do
            patch+=(--config "patch.'https://github.com/hobnix/core'.$k.path='$PWD/rust/$k'")
          done
          n=0
          for c in pkgs/official/extensions/*/Cargo.toml pkgs/official/examples/*/Cargo.toml; do
            [ -f "$c" ] || continue
            n=$((n + 1))
            echo "== $c"
            (cd "$(dirname "$c")" && cargo test "${patch[@]}")
          done
          [ "$n" -gt 0 ] || { echo "no crate found in hobnix/official"; exit 1; }
          echo "crates built: $n"

  nixos:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The nixpkgs revision comes from config/nixpkgs-pin.toml, the one place that names it (CI, ISO, docs): NIXPKGS_REV.
      - name: Read the nixpkgs pin
        run: bash scripts/dev/nixpkgs-pin.sh github-env >> "$GITHUB_ENV"
      # The pinned nixpkgs comes from the cache, not from a download per run (GitHub answered 429 once and the job failed). The `iso` job
      # uses the same cache entry.
      - uses: actions/cache@v4
        with:
          path: ~/nixpkgs.tar.gz
          key: nixpkgs-${{ env.NIXPKGS_REV }}
      - name: Unpack the pinned nixpkgs
        run: |
          [ -s ~/nixpkgs.tar.gz ] || curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o ~/nixpkgs.tar.gz "https://github.com/NixOS/nixpkgs/archive/$NIXPKGS_REV.tar.gz"
          mkdir -p "$RUNNER_TEMP/nixpkgs"
          tar -xzf ~/nixpkgs.tar.gz -C "$RUNNER_TEMP/nixpkgs" --strip-components=1
          echo "NIXPKGS_DIR=$RUNNER_TEMP/nixpkgs" >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=${{ env.NIXPKGS_DIR }}
      # servers build rust/ with the rustc of this nixpkgs; CI and developers use rust/rust-toolchain.toml: the two must be the same version
      - name: rust/rust-toolchain.toml names the rustc of the nixpkgs pin
        run: bash scripts/dev/nixpkgs-pin.sh toolchain-check "$NIXPKGS_DIR"
      - name: Evaluate the system configuration
        run: |
          cp machine.toml.example machine.toml
          sed -i 's/CHANGEME/deadbeef/' machine.toml
          cat > hardware-configuration.nix <<'HW'
          { ... }: {
            fileSystems."/" = { device = "/dev/vda1"; fsType = "ext4"; };
            boot.loader.grub.enable = false;
          }
          HW
          nix-instantiate '<nixpkgs/nixos>' -A system -I nixos-config=./configuration.nix --show-trace >/dev/null
      # Fills the binary cache (config/binary-cache.nix). Runs only when the repository variable CACHIX_CACHE is set; the push needs the secret
      # CACHIX_AUTH_TOKEN, which pull requests from forks and Dependabot do not get, so they only read from the cache.
      - uses: cachix/cachix-action@v15
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the Rust program (pkgs/hobnix.nix, with its tests)
        run: nix-build -E 'with import <nixpkgs> {}; callPackage ./pkgs/hobnix.nix {}' --no-out-link
      # The web frontend (npm ci + Vite build): pushed to the cache like the Rust program, and a stale npmDepsHash fails here instead of on a server.
      - name: Build the web frontend (pkgs/hs-web.nix)
        run: nix-build -E 'with import <nixpkgs> {}; callPackage ./pkgs/hs-web.nix {}' --no-out-link
      # 20 minutes: only for a release (a pull request into main), a tag or a manual run; the plain evaluation above runs on every pull request.
      - name: Capability matrix (each capability alone, all of them, none; docs/PLAN-modular-core.md)
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        run: |
          rm -f machine.toml hardware-configuration.nix
          bash scripts/dev/nix-matrix.sh
      # Capability packages (docs/PLAN-capabilities-repo.md Q5, decision O9): the same matrix with every package that has a Nix module vendored into
      # the checkout (`pkg.py vendor`, no --impure). First the fixture of this repository (tests/fixtures/capabilities/hello-nix), then
      # hobnix/official: the branch of the same name if it exists, else `main`; a release pull request (into main) and a v* tag use its
      # `main` (what stable servers get). Runs when the pull request touches the Nix interface (the `changes` job), always for a release pull
      # request, a tag and the runs that are not pull requests.
      - name: Capability matrix with the fixture package (--vendor)
        if: needs.changes.outputs.capmx == 'true' || github.base_ref == 'main'
        run: |
          rm -f machine.toml hardware-configuration.nix
          bash scripts/dev/nix-matrix.sh --vendor tests/fixtures/capabilities
      - name: Choose the ref of hobnix/official
        id: offref
        if: needs.changes.outputs.capmx == 'true' || github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          RELEASE: ${{ github.base_ref == 'main' || startsWith(github.ref, 'refs/tags/') }}
        run: echo "ref=$(bash scripts/dev/official-ref.sh "$HEAD_REF" "$RELEASE")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.offref.outputs.ref != ''
        with:
          repository: hobnix/official
          ref: ${{ steps.offref.outputs.ref }}
          path: pkgs/official
      - name: Capability matrix with hobnix/official (--vendor)
        if: steps.offref.outputs.ref != ''
        run: |
          echo "hobnix/official: ${{ steps.offref.outputs.ref }} at $(git -C pkgs/official rev-parse HEAD)"
          rm -f machine.toml hardware-configuration.nix
          bash scripts/dev/nix-matrix.sh --vendor pkgs/official
      - name: Installer ISO evaluates (installer/iso.nix; the image itself is built on a release tag)
        run: bash scripts/dev/build-iso.sh --eval

  # The installer ISO (installer/iso.nix, docs/PLAN-modular-core.md step 10): built when a version tag is pushed and attached to the release.
  # It waits for every test job. `!cancelled()` replaces the implicit success() so that a skipped `rust` job does not skip this one; the
  # other jobs must have succeeded (a failed or skipped one stops the release). On a tag `changes` turns every job on, so `rust` is only
  # skipped if that ever changes. A beta tag (vX.Y.Z-beta.N, cut from the milestone branch) builds the ISO too and its release is a prerelease (owner decision 2026-11-13).
  iso:
    needs: [changes, rust, scripts, tests, packages, ext-crates, nixos, integration]
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && needs.changes.result == 'success'
      && (needs.rust.result == 'success' || needs.rust.result == 'skipped')
      && needs.scripts.result == 'success'
      && needs.tests.result == 'success'
      && needs.packages.result == 'success'
      && (needs.ext-crates.result == 'success' || needs.ext-crates.result == 'skipped')
      && needs.nixos.result == 'success'
      && needs.integration.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Read the nixpkgs pin
        run: bash scripts/dev/nixpkgs-pin.sh github-env >> "$GITHUB_ENV"
      # The same revision and the same cache entry as the `nixos` job (config/nixpkgs-pin.toml), so a tag does not download it again.
      - uses: actions/cache@v4
        with:
          path: ~/nixpkgs.tar.gz
          key: nixpkgs-${{ env.NIXPKGS_REV }}
      - name: Unpack the pinned nixpkgs
        run: |
          [ -s ~/nixpkgs.tar.gz ] || curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o ~/nixpkgs.tar.gz "https://github.com/NixOS/nixpkgs/archive/$NIXPKGS_REV.tar.gz"
          mkdir -p "$RUNNER_TEMP/nixpkgs"
          tar -xzf ~/nixpkgs.tar.gz -C "$RUNNER_TEMP/nixpkgs" --strip-components=1
          echo "NIXPKGS_DIR=$RUNNER_TEMP/nixpkgs" >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=${{ env.NIXPKGS_DIR }}
      - name: Build the ISO
        run: bash scripts/dev/build-iso.sh
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          iso=$(ls result-iso/iso/*.iso | head -n1)
          # The checksum names the bare file, so `sha256sum -c` works in the folder a downloader saved both files to.
          # Copy the files out of the read-only store path; the checksum is computed in the folder of the copies.
          mkdir -p release-assets
          cp "$iso" release-assets/
          cd release-assets
          iso=$(basename "$iso")
          sha256sum "$iso" | tee "$iso.sha256"
          sha256sum -c "$iso.sha256"
          # Release notes from docs/RELEASE-NOTES-<major>.<minor>.md (v0.1.0 and v0.1.1 use RELEASE-NOTES-0.1.md); without such a file the
          # release gets GitHub's generated notes and a warning.
          mm=$(echo "${GITHUB_REF_NAME#v}" | cut -d. -f1,2)
          notes="$GITHUB_WORKSPACE/docs/RELEASE-NOTES-$mm.md"
          if [ -f "$notes" ]; then
            notes_args=(--notes-file "$notes")
          else
            echo "::warning::$notes not found: the release gets generated notes."
            notes_args=(--generate-notes)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$iso" "$iso.sha256" --clobber
          else
            pre=()
            case "$GITHUB_REF_NAME" in *-beta.*) pre=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" "$iso" "$iso.sha256" --title "$GITHUB_REF_NAME" "${pre[@]}" "${notes_args[@]}"
          fi

  # The storage scripts on loop devices with the real tools: xfs, btrfs, ext4, LUKS (dm-crypt),
  # restic, mergerfs. REQUIRE_ALL makes a test that cannot run a failure instead of a skip.
  integration:
    needs: changes
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq restic xfsprogs btrfs-progs cryptsetup mergerfs snapraid jq attr psmisc python3-pil
      - name: Tests
        run: sudo env HS_TEST_CI=1 HS_TEST_ROOT=1 bash tests/run-all.sh --root-only

  # The one check a branch rule asks for: green when no job failed or was cancelled (a job that did not have to run counts as fine).
  # Jobs come and go and the test parts have their own names; the rule only knows `ci-ok`.
  ci-ok:
    if: always()
    needs: [changes, rust, scripts, tests, packages, ext-crates, nixos, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
