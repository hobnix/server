name: ci
on:
  # Pull requests only (action minutes ran out when every push ran); a tag builds the ISO release.
  push:
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What did the change touch? Draft pull requests run nothing (mark one ready for review to start CI); the slow jobs run only when they can
  # be affected. A tag or a manual run always runs everything.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      nix: ${{ steps.f.outputs.nix }}
      root: ${{ steps.f.outputs.root }}
      rust: ${{ steps.f.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          nix=true root=true rust=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
            # nix: the system configuration; root: scripts and root tests (loop devices, packages against this core)
            echo "$files" | grep -qvE '^(web/|docs/|tests/|\.claude/|\.github/ISSUE_TEMPLATE/)|\.md$' || nix=false
            echo "$files" | grep -qvE '^(web/|docs/|\.claude/|\.github/ISSUE_TEMPLATE/)|\.md$' || root=false
            # rust: the Cargo workspace, the scripts it stands in for, or this workflow
            echo "$files" | grep -qE '^rust/|^\.github/workflows/ci\.yml$|^scripts/vault-change\.sh$|^tests/vault-change(-rust)?\.sh$|^tests/lib\.sh$|^scripts/lib/job\.sh$|^scripts/job-record\.py$|^scripts/jobs-change\.sh$|^scripts/job-reconcile\.sh$|^tests/job-(record|reconcile)(-rust)?\.sh$|^tests/jobs-change\.sh$' || rust=false
          fi
          echo "nix=$nix" >> "$GITHUB_OUTPUT"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "evaluate the system: $nix; root tests and packages: $root; rust: $rust"

  # The Rust workspace (docs/adr/0001-rust-strangler.md): format, clippy without warnings, tests; the lock file must be up to date.
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: tests/vault-change.sh against the binary, and shell and Rust side by side (tests/vault-change-rust.sh)
        run: |
          cargo build --locked
          HOBNIX_BIN=$PWD/target/debug/hobnix bash ../tests/vault-change-rust.sh
      - name: tests/job-record.sh, job-reconcile.sh and jobs-change.sh against the binary, and python and Rust side by side (tests/job-record-rust.sh)
        run: HOBNIX_BIN=$PWD/target/debug/hobnix bash ../tests/job-record-rust.sh

  scripts:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Syntax of every script
        run: for f in scripts/*.sh scripts/lib/*.sh scripts/recipes/*.sh vps/*.sh tests/*.sh; do bash -n "$f" || exit 1; done
      - name: Changelog entry for a user-visible change (warning only)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          bash scripts/dev/changelog-check.sh "$BASE" || echo "::warning::No docs/changelog entry: add one if users see this change (CONTRIBUTING.md)."
      - name: shellcheck (errors only)
        run: |
          shellcheck -S error -x scripts/*.sh scripts/lib/*.sh scripts/recipes/*.sh vps/*.sh tests/*.sh
      - name: shellcheck warnings in the pool scripts (informational, counts only)
        continue-on-error: true
        run: |
          shellcheck -x -S warning -f gcc scripts/manage-pool.sh tests/pool-*.sh > /tmp/pool-shellcheck.txt || true
          echo "shellcheck warnings in manage-pool.sh and tests/pool-*.sh: $(wc -l < /tmp/pool-shellcheck.txt)"
          cut -d: -f4- /tmp/pool-shellcheck.txt | sort | uniq -c | sort -rn | head -10
      - name: Tests that need no root (every tests/*.sh; tests/run-all.sh lists them, root tests are skipped here)
        run: |
          sudo apt-get install -y -qq jq python3-pil
          HS_TEST_CI=1 bash tests/run-all.sh --jobs 2

  # The default package repositories at their latest main, checked against this core: manifests, indexes and their own tests. A core change
  # that breaks a package is seen here, before a release (docs/PLAN-packages.md, "Compatibility and CI across repositories").
  packages:
    needs: changes
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: hobnix/recipes
          path: pkgs/recipes
      - uses: actions/checkout@v5
        with:
          repository: hobnix/extensions
          path: pkgs/extensions
      - name: Manifests and indexes
        run: |
          mkdir -p pkgs/tree
          ln -s "$PWD/pkgs/recipes/recipes" pkgs/tree/packages
          ln -s "$PWD/pkgs/extensions/extensions" pkgs/tree/capabilities
          HS_PACKAGES_ROOT="$PWD/pkgs/tree" python3 -I scripts/pkg.py validate
          python3 -I scripts/pkg.py repo-check pkgs/recipes
          python3 -I scripts/pkg.py repo-check pkgs/extensions
      - name: The tests of both repositories against this core
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq python3-pil
          for r in recipes extensions; do HS_CORE="$PWD" HS_TEST_CI=1 bash pkgs/$r/tests/run-all.sh || exit 1; done

  nixos:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Evaluate the system configuration
        run: |
          cp machine.toml.example machine.toml
          sed -i 's/CHANGEME/deadbeef/' machine.toml
          cat > hardware-configuration.nix <<'HW'
          { ... }: {
            fileSystems."/" = { device = "/dev/vda1"; fsType = "ext4"; };
            boot.loader.grub.enable = false;
          }
          HW
          nix-instantiate '<nixpkgs/nixos>' -A system -I nixos-config=./configuration.nix --show-trace >/dev/null
      # Fills the binary cache (config/binary-cache.nix). Runs only when the repository variable CACHIX_CACHE is set; the push needs the secret
      # CACHIX_AUTH_TOKEN, which pull requests from forks and Dependabot do not get, so they only read from the cache.
      - uses: cachix/cachix-action@v15
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the Rust program (pkgs/hobnix.nix, with its tests)
        run: nix-build -E 'with import <nixpkgs> {}; callPackage ./pkgs/hobnix.nix {}' --no-out-link
      # 20 minutes: only for a release (a pull request into main), a tag or a manual run; the plain evaluation above runs on every pull request.
      - name: Capability matrix (each capability alone, all of them, none; docs/PLAN-modular-core.md)
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        run: |
          rm -f machine.toml hardware-configuration.nix
          bash scripts/dev/nix-matrix.sh
      - name: Installer ISO evaluates (installer/iso.nix; the image itself is built on a release tag)
        run: bash scripts/dev/build-iso.sh --eval

  # The installer ISO (installer/iso.nix, docs/PLAN-modular-core.md step 10): built when a version tag is pushed and attached to the release.
  iso:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build the ISO
        run: bash scripts/dev/build-iso.sh
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          iso=$(ls result-iso/iso/*.iso | head -n1)
          sha256sum "$iso" | tee "$iso.sha256"
          gh release create "$GITHUB_REF_NAME" "$iso" "$iso.sha256" --title "$GITHUB_REF_NAME" --notes "Installer ISO: boot it in UEFI mode and run hs-install. Guide: docs/install.md." || gh release upload "$GITHUB_REF_NAME" "$iso" "$iso.sha256" --clobber

  # The storage scripts on loop devices with the real tools: xfs, btrfs, ext4, LUKS (dm-crypt),
  # restic, mergerfs. REQUIRE_ALL makes a test that cannot run a failure instead of a skip.
  integration:
    needs: changes
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq restic xfsprogs btrfs-progs cryptsetup mergerfs snapraid jq attr psmisc python3-pil
      - name: Tests
        run: sudo env HS_TEST_CI=1 HS_TEST_ROOT=1 bash tests/run-all.sh --root-only
