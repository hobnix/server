# Hand-written shapes of `hs sys` outputs; scripts/openapi-gen.py turns them into docs/api/openapi.json.
# Key = the row path without "sys ". Fields: kind (tsv|json|text); either columns = [...] (every line has these fields) or
# records = {tag = [fields after the tag]} (the first field names the line); optional enums = {field = [...]}
# (records: "tag.field" for one line kind), stdin = "line"|"bytes", note. Rows without an entry are marked x-hs-described: false.

["jobs list"]
kind = "tsv"
columns = ["unit", "description", "next", "last", "result"]
enums = { result = ["ok", "failed", "never"] }

["jobs running"]
kind = "tsv"
columns = ["unit", "description", "started"]

["jobs tail <unit>"]
kind = "tsv"
records = { state = ["state"], exit = ["status"], line = ["text"], next = ["count"] }
enums = { state = ["running", "ok", "failed", "unknown"] }

["jobs record <id>"]
kind = "json"
note = "One job record (docs/adr/0004-job-record.md): id, slug, description, source, initiator, unit, queued, started, ended, state, exit, step {n, of, text}, progress {done, total, unit}, error, result, cancel, version. Absent values are null."

["jobs records"]
kind = "tsv"
columns = ["id", "slug", "description", "state", "queued", "started", "ended", "exit", "step_n", "step_of", "step_text", "progress_done", "progress_total", "progress_unit"]
enums = { state = ["queued", "running", "ok", "failed", "cancelled", "interrupted"] }

["event list"]
kind = "tsv"
columns = ["id", "time", "source", "kind", "subject", "level", "text", "payload"]
enums = { level = ["info", "warn", "error"] }

["ct list"]
kind = "tsv"
columns = ["name", "type", "state", "address", "ram", "cpu", "autostart", "mac_pinned", "docker", "disk", "snapshots",
           "last_snapshot", "memory_in_use", "cpu_time", "bindings", "last_start_utc", "owner"]

["pool state"]
kind = "tsv"
records = { lock = ["state", "text"], paused = ["state", "text"], scrub = ["pool", "state", "text"], sync = ["pool", "state", "text"] }
enums = { "lock.state" = ["pool-change", "free", "busy", "unknown"], "paused.state" = ["yes", "no"] }

["pool state <pool>"]
kind = "tsv"
records = { lock = ["state", "text"], paused = ["state", "text"], scrub = ["pool", "state", "text"], sync = ["pool", "state", "text"] }
enums = { "lock.state" = ["pool-change", "free", "busy", "unknown"], "paused.state" = ["yes", "no"] }

["release show"]
kind = "tsv"
records = { channel = ["channel"], installed = ["version"], offer = ["channel", "ref", "state"], ref = ["ref"], state = ["state"], signed = ["signed"] }
enums = { "offer.state" = ["none", "unknown", "current", "kept", "update"], "state.state" = ["none", "unknown", "current", "kept", "update"], "signed.signed" = ["yes", "no", "-"] }
