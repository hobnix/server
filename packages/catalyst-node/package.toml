# Manifest of a package (docs/PLAN-packages.md). Until the packages move out of this repository the header lines of the
# script still say the same (tests/pkg.sh keeps both in step).
name = "catalyst-node"
version = "1.0.0"
kind = "recipe"
title = "runs the game servers of the Catalyst panel (containerd and the Rust agent)"
title_de = "führt die Spieleserver des Catalyst-Panels aus (containerd und der Rust-Agent)"
requires_core = ">=1"
audience = "generic"
needs = []
uses = []
input = "form"
script = "run.sh"

[[ask]]
key = "DEPLOY_CMD"
label = "Install command of the node (Admin -> Nodes -> Register Node; it starts with curl)"
type = "secret"
