# Manifest of a package (docs/PLAN-packages.md). Until the packages move out of this repository the header lines of the
# script still say the same (tests/pkg.sh keeps both in step).
name = "upload-storage"
version = "1.0.0"
kind = "recipe"
title = "your own file sync and upload server (Seafile or ownCloud), with apps for phone and PC"
title_de = "dein eigener Server zum Hochladen und Synchronisieren von Dateien (Seafile oder ownCloud), mit Apps für Handy und PC"
requires_core = ">=1"
audience = "generic"
needs = ["docker", "share"]
uses = []
input = "form"
script = "run.sh"

[[ask]]
key = "PRODUCT"
label = "Which one: seafile (fast, syncs libraries, stores blocks) or owncloud (plain files, familiar Dropbox-like web interface)"
type = "choice"
choices = ["seafile", "owncloud"]
default = "seafile"

[[ask]]
key = "DOMAIN"
label = "Public host name, if it should be reachable from the internet (empty: none; the route is made with hs services apply)"
type = "text"
pattern = "(([a-z0-9-]+\\.)+[a-z]{2,})?"

[[ask]]
key = "ADMIN_EMAIL"
label = "E-mail address of the first administrator (the Seafile login name)"
type = "text"
default = "admin@example.com"
pattern = "[^@ ]+@[^@ ]+"
when = "PRODUCT=seafile"
