<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arr</title>
<style>
  :root { color-scheme: dark light; font-family: system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1e1e2e; color: #cdd6f4; }
  main { width: min(36rem, 92vw); }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 1rem; }
  a { display: block; padding: .9rem 1rem; margin: .5rem 0; border-radius: .6rem; background: #313244; color: inherit; text-decoration: none; }
  a:hover { background: #45475a; }
  b { display: block; } small { opacity: .7; }
</style>
</head>
<body>
<main>
  <h1>Films, series and music</h1>
  <a data-app="radarr" data-port="7878"><b>Radarr</b><small>Films: search, download, file</small></a>
  <a data-app="sonarr" data-port="8989"><b>Sonarr</b><small>Series: the same for episodes</small></a>
  <a data-app="lidarr" data-port="8686"><b>Lidarr</b><small>Music: the same for albums</small></a>
  <a data-app="prowlarr" data-port="9696"><b>Prowlarr</b><small>Indexers for Radarr, Sonarr and Lidarr</small></a>
  <a data-app="bazarr" data-port="6767"><b>Bazarr</b><small>Subtitles</small></a>
  <a data-app="maintainerr" data-port="6246"><b>Maintainerr</b><small>Clean-up rules for unwatched media</small></a>
</main>
<script>
  // arr.<rest> -> <app>.<rest> (the gateway answers by name); an address or any other name -> address:port
  var h = location.hostname, m = /^arr\.(.+)$/.exec(h);
  document.querySelectorAll("a[data-app]").forEach(function (a) {
    a.href = m ? "http://" + a.dataset.app + "." + m[1] + "/" : "http://" + h + ":" + a.dataset.port + "/";
  });
</script>
</body>
</html>
