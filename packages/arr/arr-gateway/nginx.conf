# Written by "hs recipe arr". Port 80 of the container: <app>.<anything> goes to the app, every other name gets the start page.
# Host network, so the apps are reached on 127.0.0.1 (their ports stay open for direct use as well).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri /index.html; }
}

server { listen 80; server_name radarr.*;      location / { include /etc/nginx/proxy.inc; proxy_pass http://127.0.0.1:7878; } }
server { listen 80; server_name sonarr.*;      location / { include /etc/nginx/proxy.inc; proxy_pass http://127.0.0.1:8989; } }
server { listen 80; server_name lidarr.*;      location / { include /etc/nginx/proxy.inc; proxy_pass http://127.0.0.1:8686; } }
server { listen 80; server_name prowlarr.*;    location / { include /etc/nginx/proxy.inc; proxy_pass http://127.0.0.1:9696; } }
server { listen 80; server_name bazarr.*;      location / { include /etc/nginx/proxy.inc; proxy_pass http://127.0.0.1:6767; } }
server { listen 80; server_name maintainerr.*; location / { include /etc/nginx/proxy.inc; proxy_pass http://127.0.0.1:6246; } }
