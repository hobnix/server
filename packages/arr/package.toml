# Manifest of a package (docs/PLAN-packages.md). Until the packages move out of this repository the header lines of the
# script still say the same (tests/pkg.sh keeps both in step).
name = "arr"
version = "1.1.0"
kind = "recipe"
title = "Radarr, Sonarr and Lidarr keep your films, series and music in order, Prowlarr holds the indexers, Bazarr fetches subtitles"
title_de = "Radarr, Sonarr und Lidarr halten Filme, Serien und Musik in Ordnung, Prowlarr verwaltet die Indexer, Bazarr holt Untertitel"
requires_core = ">=1"
audience = "generic"
needs = ["docker", "share"]
uses = []
input = "none"
script = "run.sh"

# What the web interface may read, only while the recipe is applied on this server (scripts/web-serve.py ext_load_web). Same format as an
# extension's capability.toml. Not generated by `hs pkg convert`: keep this part when the header lines are converted again.
[[web.reads]]
words = "status"
kind = "tsv"
ttl = 15

[web.page]
title = "Films and series"
icon = "film-strip"
crumb = "Apps"
sub = "Radarr, Sonarr, Lidarr, Prowlarr, Bazarr and Maintainerr in the container arr"

[[web.page.blocks]]
type = "table"
title = "Services"
read = "status"
key = "app"
empty = "The arr container does not exist yet. Run the recipe arr."
columns = [
  { key = "app", label = "App", icon = "play-circle" },
  { key = "port", label = "Port", col = 1, kind = "mono" },
  { key = "state", label = "State", col = 2, kind = "dot", map = { up = ["ok", "running"], down = ["bad", "stopped"], missing = ["off", "not created"] } },
  { key = "url", label = "Open", col = 3, kind = "mono" },
]
