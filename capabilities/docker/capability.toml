# Manifest of a capability (docs/PLAN-modular-core.md). See capabilities/metrics/capability.toml for the fields.
name = "docker"
title = "Docker host with a web page to manage it"
title_de = "Docker-Host mit einer Webseite zur Verwaltung"
kind = "provider"
requires = []
# the interface this capability fulfils; a variant is a file scripts/providers/docker/<variant>.sh that the recipe SOURCES (not a script
# with verbs). "webui" (the web interface of hobnix, built later) and "none" (Docker only) have no file.
provides = ["docker-manager"]
variants = ["arcane", "portainer"]
needs = []
# On when the setting dockerManager is set (webui, arcane, portainer or none; `hs docker enable` sets it). No NixOS module: the container
# is made by scripts/docker.sh. The recipe docker still has its own preference MANAGER (recipe-<ct>.conf) until `hs docker adopt` exists.
implied_by = ["dockerManager"]
notes = "NOTES.md"
