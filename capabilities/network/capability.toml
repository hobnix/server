# Manifest of a capability (docs/PLAN-modular-core.md). See capabilities/metrics/capability.toml for the fields.
name = "network"
title = "Router connection (fixed addresses for instances)"
title_de = "Router-Anbindung (feste Adressen für Instanzen)"
kind = "provider"
requires = []
# the interface this capability fulfils; a variant is a script scripts/providers/network/<variant>.sh with the verbs
# info | ready | used <ip> | reserved <mac> | set-ip <mac> <ip> [name]. Without a provider, instances take what DHCP gives and the
# recipes ask the person to reserve the address on the router.
provides = ["network"]
variants = ["unifi"]
needs = []
# No NixOS module. It counts as on once the runtime setting networkProvider names a variant (hs net setup sets it).
implied_by = ["networkProvider"]
notes = "NOTES.md"
